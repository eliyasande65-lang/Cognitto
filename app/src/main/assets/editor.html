<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c0e12">
<title>Cognitto</title>
<style>
:root{--bg:#0c0e12;--panel:#141820;--panel2:#1a202a;--line:#252d39;--text:#e7ebf2;--muted:#8490a1;--gold:#c7a76a;--green:#8ec7a2;--blue:#8bb8e8;--red:#ef8585;--font:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--line);background:#101319;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.3px}.mark{width:29px;height:29px;border:1px solid #806d4b;border-radius:9px;display:grid;place-items:center;color:var(--gold);font-weight:800;background:linear-gradient(145deg,#25221c,#111318)}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.5px}
.actions{display:flex;gap:8px}.iconbtn,button,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 11px;font:inherit}.iconbtn{min-width:37px;padding:8px}.primary{background:#a98952;color:#101116;border-color:#c7a76a;font-weight:700}
.filebar{height:43px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#101319;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}.tab{padding:9px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:12px}.tab.active{color:var(--text);border-color:var(--gold);background:#171c24}
.toolbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}.toolbar select{flex:1;min-width:0;padding:7px;font-size:12px}.tool{font-size:12px;padding:7px 9px}
.workspace{flex:1;min-height:0;display:flex;position:relative;background:var(--bg)}.gutter{width:42px;overflow:hidden;padding:12px 7px;text-align:right;color:#586273;font:var(--font)/1.65 ui-monospace,monospace;background:#0f1217;user-select:none;white-space:pre;border-right:1px solid #1d242e}
.editorwrap{position:relative;flex:1;min-width:0;overflow:hidden}.code,.highlight{position:absolute;inset:0;margin:0;padding:12px 14px;border:0;outline:0;resize:none;overflow:auto;white-space:pre;tab-size:4;font:var(--font)/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0;}.highlight{pointer-events:none;color:#d9e0eb;overflow:hidden}.code{color:transparent;background:transparent;caret-color:#f2d7a2;-webkit-text-fill-color:transparent;z-index:2}.code::selection{background:#6a789966}.tok-key{color:#c6a4ed}.tok-str{color:#a6ce9b}.tok-num{color:#e7b879}.tok-com{color:#748394;font-style:italic}.tok-tag{color:#e59c83}.tok-attr{color:#d6c08b}.tok-fn{color:#8bb8e8}
.bottom{height:30px;background:#141922;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:10px;flex-shrink:0}.statusdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}
.suggest{position:absolute;z-index:5;left:48px;right:15px;bottom:44px;max-height:185px;overflow:auto;background:#1b222d;border:1px solid #394454;border-radius:12px;box-shadow:0 12px 30px #0009;display:none}.suggest.show{display:block}.suggest div{padding:9px 12px;border-bottom:1px solid #2a3340;font:12px ui-monospace,monospace}.suggest div.sel{background:#344052;color:#f3d8a5}
.diagnostics{display:none;background:#171c24;border-top:1px solid var(--line);padding:9px 13px;color:var(--red);font-size:11px;max-height:90px;overflow:auto}.diagnostics.show{display:block}
#shade{position:fixed;inset:0;background:#0009;display:none;z-index:8;align-items:center;justify-content:center;padding:22px}#shade.show{display:flex}.modal{width:100%;max-width:360px;background:#171d26;border:1px solid #394454;border-radius:16px;padding:18px}.modal h3{margin:0 0 14px}.modal label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}.modal input,.modal select{width:100%;padding:10px}.modal .row{display:flex;gap:8px;margin-top:16px}.modal .row button{flex:1}
.preview{display:none;position:absolute;inset:0;background:white;z-index:4}.preview iframe{width:100%;height:100%;border:0;background:white}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">C</div><div>cognitto<small>CODE STUDIO</small></div></div><div class="actions"><button class="iconbtn" onclick="undo()" title="Undo">↶</button><button class="iconbtn" onclick="redo()" title="Redo">↷</button><button class="iconbtn" onclick="showSettings()" title="Settings">⚙</button></div></header>
<div class="filebar"><div class="tab active" id="fileTab">index.js</div><button class="tool" onclick="newFile()">＋</button><button class="tool" onclick="openFile()">Open</button><button class="tool" onclick="saveFile()">Export</button></div>
<div class="toolbar"><select id="language" onchange="changeLanguage()"><option value="javascript">JavaScript</option><option value="python">Python</option><option value="html">HTML</option><option value="css">CSS</option></select><button class="tool" onclick="findCode()">Find</button><button class="tool" onclick="togglePreview()">Preview</button><button class="tool primary" onclick="checkCode()">Check</button></div>
<div class="workspace"><div class="gutter" id="lines">1</div><div class="editorwrap"><pre class="highlight" id="highlight"></pre><textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea><div class="suggest" id="suggest"></div><div class="preview" id="preview"><iframe id="frame" sandbox="allow-scripts"></iframe></div></div></div>
<div class="diagnostics" id="diagnostics"></div><div class="bottom"><span><i class="statusdot"></i><span id="status">Ready · Offline</span></span><span id="position">Ln 1, Col 1</span><span id="count">0 lines</span></div>
<div id="shade"><div class="modal"><h3>Editor settings</h3><label>Theme</label><select id="theme" onchange="setTheme()"><option value="dark">Graphite</option><option value="midnight">Midnight blue</option><option value="light">Light</option></select><label>Font size</label><input id="fontsize" type="range" min="11" max="22" value="14" oninput="setFont()"><label>Tab width</label><select id="tabwidth"><option>2</option><option selected>4</option><option>8</option></select><div class="row"><button onclick="closeSettings()">Close</button><button class="primary" onclick="closeSettings()">Done</button></div></div></div>
<script>
const $=id=>document.getElementById(id), code=$('code');let filename='index.js',lang='javascript',history=[],redoStack=[],suggestions=[],suggestIndex=0,previewing=false;
const samples={javascript:'// Welcome to Cognitto\nfunction greet(name) {\n    const message = `Hello, ${name}!`;\n    console.log(message);\n}\n\ngreet("Developer");\n',python:'# Welcome to Cognitto\ndef greet(name):\n    message = f"Hello, {name}!"\n    print(message)\n\ngreet("Developer")\n',html:'<!doctype html>\n<html>\n<head>\n  <title>My page</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Hello, Cognitto!</h1>\n  <script src="app.js"><\\/script>\n</body>\n</html>\n',css:'/* Welcome to Cognitto */\n:root {\n  color-scheme: dark;\n}\n\nbody {\n  font-family: system-ui, sans-serif;\n  background: #101319;\n  color: #f1f1f1;\n}\n'};
const words={javascript:['const','let','var','function','return','if','else','for','while','class','new','this','true','false','null','undefined','async','await','import','export','from','try','catch','throw','console','log','map','filter','forEach','length','JSON','Promise','document','window'],python:['def','class','return','if','elif','else','for','while','in','import','from','as','try','except','finally','with','lambda','True','False','None','print','range','len','self','async','await'],html:['html','head','body','div','span','main','section','header','footer','nav','h1','h2','p','a','img','button','input','form','script','style','class','id','src','href'],css:['color','background','display','flex','grid','margin','padding','border','width','height','position','font-size','font-family','align-items','justify-content','gap','transform','transition','hover','var']};
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function paint(){let s=esc(code.value);let rules=lang==='html'?[/(&lt;\/?[a-zA-Z][^&]*?&gt;)/g,/([a-zA-Z-]+)(=)/g]:lang==='css'?[/([.#]?[a-zA-Z-]+)(\s*\{)/g,/([a-z-]+)(\s*:)/g]:[/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)/g,/\/\/[^\n]*|#[^\n]*/g,/\b(\d+(?:\.\d+)?)\b/g,/\b(const|let|var|function|return|if|else|for|while|class|new|this|true|false|null|undefined|async|await|import|export|from|try|catch|throw|def|elif|in|except|finally|with|lambda|True|False|None|print)\b/g];if(lang==='html'){s=s.replace(rules[0],'<span class="tok-tag">$1</span>').replace(rules[1],'<span class="tok-attr">$1</span>$2')}else if(lang==='css'){s=s.replace(rules[0],'<span class="tok-fn">$1</span>$2').replace(rules[1],'<span class="tok-attr">$1</span>$2')}else{s=s.replace(rules[0],'<span class="tok-str">$1</span>').replace(rules[1],'<span class="tok-com">$&</span>').replace(rules[2],'<span class="tok-num">$1</span>').replace(rules[3],'<span class="tok-key">$1</span>')} $('highlight').innerHTML=s+'\n';$('lines').textContent=Array.from({length:Math.max(1,code.value.split('\n').length)},(_,i)=>i+1).join('\n');$('count').textContent=code.value.split('\n').length+' lines';syncScroll();position()}
function syncScroll(){$('highlight').scrollTop=code.scrollTop;$('highlight').scrollLeft=code.scrollLeft;$('lines').scrollTop=code.scrollTop}
function position(){let a=code.selectionStart,b=code.value.slice(0,a).split('\n');$('position').textContent='Ln '+b.length+', Col '+(b.at(-1).length+1)}
function remember(){history.push(code.value);if(history.length>80)history.shift();redoStack=[]}
code.value=samples.javascript;paint();code.addEventListener('input',()=>{paint();showSuggestions()});code.addEventListener('scroll',syncScroll);code.addEventListener('click',position);code.addEventListener('keyup',e=>{position();if(!['ArrowDown','ArrowUp','Enter','Tab'].includes(e.key))showSuggestions();if(e.key==='ArrowDown'||e.key==='ArrowUp')moveSuggestion(e.key==='ArrowDown'?1:-1);if(e.key==='Escape')hideSuggestions()});
code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();if($('suggest').classList.contains('show')){acceptSuggestion();return}insertAtCursor('    ')}else if(e.key==='Enter'){if($('suggest').classList.contains('show')){e.preventDefault();acceptSuggestion();return}let before=code.value.slice(0,code.selectionStart),indent=(before.split('\n').at(-1).match(/^\s*/)||[''])[0];if(/[\{\[\(:]\s*$/.test(before.split('\n').at(-1)))indent+='    ';e.preventDefault();insertAtCursor('\n'+indent)}});
function insertAtCursor(v){let a=code.selectionStart,b=code.selectionEnd;remember();code.setRangeText(v,a,b,'end');paint()}
function undo(){if(history.length){redoStack.push(code.value);code.value=history.pop();paint()}}function redo(){if(redoStack.length){history.push(code.value);code.value=redoStack.pop();paint()}}
function showSuggestions(){let m=code.value.slice(0,code.selectionStart).match(/[\w$-]+$/),q=m?.[0]||'';if(!q||q.length<1){hideSuggestions();return}let list=(words[lang]||[]).filter(w=>w.toLowerCase().startsWith(q.toLowerCase())&&w!==q).slice(0,7);if(!list.length){hideSuggestions();return}suggestions=list;suggestIndex=0;$('suggest').innerHTML=list.map((w,i)=>'<div class="'+(i===0?'sel':'')+'" onclick="acceptSuggestion('+i+')">'+esc(w)+'</div>').join('');$('suggest').classList.add('show')}
function moveSuggestion(d){if(!$('suggest').classList.contains('show'))return;suggestIndex=(suggestIndex+d+suggestions.length)%suggestions.length;[...$('suggest').children].forEach((n,i)=>n.classList.toggle('sel',i===suggestIndex))}
function acceptSuggestion(i=suggestIndex){if(!suggestions.length)return;let m=code.value.slice(0,code.selectionStart).match(/[\w$-]+$/);let a=code.selectionStart-(m?.[0].length||0);remember();code.setRangeText(suggestions[i],a,code.selectionStart,'end');hideSuggestions();paint()}
function hideSuggestions(){ $('suggest').classList.remove('show');suggestions=[]}
function changeLanguage(){lang=$('language').value;filename=({javascript:'index.js',python:'main.py',html:'index.html',css:'style.css'})[lang];$('fileTab').textContent=filename;code.value=samples[lang];$('preview').style.display='none';previewing=false;paint()}
function newFile(){if(!confirm('Start a new file? Unsaved changes will be replaced.'))return;code.value='';paint();$('status').textContent='New file'}
function openFile(){Cognitto.openFile()}
function saveFile(){Cognitto.saveFile(filename,code.value)}
window.fileSaved=()=>{$('status').textContent='Exported successfully';Cognitto.toast('Saved to selected location')};
window.loadOpenedFile=(name,text)=>{filename=name;code.value=text;let ext=name.split('.').pop().toLowerCase();lang=({js:'javascript',py:'python',html:'html',htm:'html',css:'css'})[ext]||'javascript';$('language').value=lang;$('fileTab').textContent=filename;paint();$('status').textContent='Opened '+name};
function checkCode(){let errors=[],s=code.value;if(lang==='javascript'||lang==='python'){let stack=[];for(let i=0;i<s.length;i++){if('([{'.includes(s[i]))stack.push([s[i],i]);if(')]}'.includes(s[i])){let x=stack.pop();if(!x||'([{'.indexOf(x[0])!==')]}'.indexOf(s[i])){errors.push('Unmatched closing '+s[i]+' near line '+(s.slice(0,i).split('\n').length));break}}}if(stack.length)errors.push('Unclosed '+stack.at(-1)[0]+' near line '+(s.slice(0,stack.at(-1)[1]).split('\n').length));if(lang==='javascript'&&/\b(const|let|var)\s*;/.test(s))errors.push('Variable declaration is missing a name')}if(!errors.length)errors.push('No basic syntax issues detected. Runtime errors require execution.');$('diagnostics').innerHTML=errors.map(esc).join('<br>');$('diagnostics').classList.add('show');$('status').textContent=errors[0].startsWith('No')?'Check complete':'Issues found'}
function findCode(){let q=prompt('Find text');if(!q)return;let i=code.value.indexOf(q,code.selectionStart);if(i<0)i=code.value.indexOf(q);if(i>=0){code.focus();code.setSelectionRange(i,i+q.length);position()}else Cognitto.toast('No match found')}
function togglePreview(){if(lang!=='html'){Cognitto.toast('Preview is available for HTML files');return}previewing=!previewing;$('preview').style.display=previewing?'block':'none';if(previewing)$('frame').srcdoc=code.value}
function showSettings(){$('shade').classList.add('show')}function closeSettings(){$('shade').classList.remove('show')}
function setFont(){document.documentElement.style.setProperty('--font',$('fontsize').value+'px')}
function setTheme(){let t=$('theme').value;if(t==='light'){document.documentElement.style.setProperty('--bg','#f3f5f8');document.documentElement.style.setProperty('--panel','#e7ebf1');document.documentElement.style.setProperty('--panel2','#dce2ea');document.documentElement.style.setProperty('--text','#202734');document.documentElement.style.setProperty('--muted','#657184');document.documentElement.style.setProperty('--line','#cbd2dc');$('highlight').style.color='#253044'}else{document.documentElement.style.setProperty('--bg',t==='midnight'?'#080f1c':'#0c0e12');document.documentElement.style.setProperty('--panel',t==='midnight'?'#111c2c':'#141820');document.documentElement.style.setProperty('--panel2','#1a202a');document.documentElement.style.setProperty('--text','#e7ebf2');document.documentElement.style.setProperty('--muted','#8490a1');document.documentElement.style.setProperty('--line','#252d39');$('highlight').style.color='#d9e0eb'}}
function handleBack(){if($('shade').classList.contains('show'))closeSettings();else if(previewing)togglePreview();else if($('diagnostics').classList.contains('show'))$('diagnostics').classList.remove('show');else Cognitto.toast('Use Export to save your work')}
window.handleBack=handleBack;
</script></body></html>
